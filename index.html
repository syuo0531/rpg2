/* Weekly time grid: dates vertically, half-hour time slots horizontally */
.axis-panel{overflow:hidden}
.axis-bar{padding:13px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;border-bottom:1px solid var(--line)}
.axis-bar strong{font-weight:800;font-size:14px}
.axis-filters{display:flex;flex-wrap:wrap;gap:7px}
.axis-filters .control{width:auto;min-width:110px;min-height:36px;padding:7px 9px;font-size:12px}
.axis-scroll{overflow:auto;max-height:68vh;overscroll-behavior:contain}
.axis-table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:11px}
.axis-table th,.axis-table td{border-right:1px solid #e4ebf3;border-bottom:1px solid #e4ebf3;vertical-align:top}
.axis-table thead th{position:sticky;top:0;z-index:3;background:#eff4fa;padding:11px 7px;text-align:center;color:#485e78;font-size:12px;font-weight:850;min-width:136px;width:136px;box-shadow:0 1px 0 #dce5ed;font-variant-numeric:tabular-nums}
.axis-table tbody td{padding:7px 6px;width:136px;min-width:136px;height:105px}
.axis-table tr>*:last-child{border-right:0}
.axis-table tbody tr:last-child>*{border-bottom:0}
.axis-table thead th:first-child,.axis-table tbody th:first-child{position:sticky;left:0;width:108px;min-width:108px;max-width:108px;z-index:4;text-align:left;background:#fff;box-shadow:1px 0 0 #dce5ed;padding:11px 9px}
.axis-table thead th:first-child{z-index:6;background:#eff4fa}
.axis-table tbody tr.axis-today th:first-child{background:#eaf3ff;color:#2159a0}
.axis-table tbody th strong{display:block;font-size:13px;white-space:normal}
.axis-table tbody th small{display:block;margin-top:5px;color:var(--sub);font-size:10px;font-weight:500}
.axis-cell-empty{background:#f9fbfd}
.axis-cell-free{background:#f0faf5}
.axis-cell-booked{background:#eef4ff}
.axis-action{display:block;border:1px solid transparent;min-height:30px;width:100%;text-align:left;padding:5px 7px;border-radius:7px;font-size:11px;margin-bottom:4px;line-height:1.35;overflow-wrap:anywhere}
.axis-action:last-child{margin-bottom:0}
.axis-action b,.axis-action small{display:block}
.axis-action small{font-size:10px;margin-top:2px}
.axis-booking{background:#dfeaff;border-color:#c9defa;color:#285a9b;font-weight:750}
.axis-booking.tentative{background:#fff0d4;color:#946313;border-color:#f4d69a}
.axis-booking.done{background:#e1f4ea;color:#167458;border-color:#b6e4d0}
.axis-continue{opacity:.7}
.axis-free{background:#e1f5e9;color:#256b50;border-color:#b5e3c9;border-style:dashed;cursor:pointer}
.axis-free:hover{background:#cbedda}
.axis-shift{font-size:10px;color:#657e9a;display:block;padding:0 2px 4px}
.axis-shift button{font:inherit;border:0;background:transparent;color:inherit;min-height:0;padding:0;text-decoration:underline;text-decoration-style:dotted;text-align:left}
.axis-dash{color:#9da9b5}
.axis-legend{padding:12px 16px;display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--sub);border-top:1px solid var(--line)}
.axis-help{margin:9px 0 17px;color:var(--sub);font-size:11px;line-height:1.7}
.axis-details{margin-top:18px}
.axis-details .section-head{margin-bottom:10px}
@media(max-width:720px){.axis-scroll{max-height:60vh}.axis-bar{padding:12px}.axis-filters{width:100%}.axis-filters .control{flex:1;min-width:0}.axis-table thead th,.axis-table tbody td{min-width:126px;width:126px}.axis-table thead th:first-child,.axis-table tbody th:first-child{min-width:85px;width:85px;max-width:85px;padding:9px 7px}.axis-table tbody th strong{font-size:12px}}

.timeboard-table th,.timeboard-table td{border-right:1px solid #e5ebf2;border-bottom:1px solid #e5ebf2}

.timeboard-table thead th{position:sticky;top:0;z-index:4;background:#f0f5fb;height:43px;text-align:left;padding:8px 4px;color:#556a80;font-size:10px;font-variant-numeric:tabular-nums}
.timeboard-table .tb-time{width:var(--slot);min-width:var(--slot);max-width:var(--slot);text-align:center}
.timeboard-table .tb-time.hour{background:#e5effb;font-weight:850;color:#204d8c}
.timeboard-table .tb-day{position:sticky;left:0;min-width:var(--datew);width:var(--datew);max-width:var(--datew);z-index:3;background:#fff;padding:9px;vertical-align:top;text-align:left;box-shadow:1px 0 0 #d8e2ee}
.timeboard-table .tb-person{position:sticky;left:var(--datew);min-width:var(--staffw);width:var(--staffw);max-width:var(--staffw);z-index:2;background:#fff;padding:10px 8px;vertical-align:middle;text-align:left;box-shadow:1px 0 0 #d8e2ee}
.timeboard-table thead .tb-day,.timeboard-table thead .tb-person{z-index:6;top:0;background:#eff4fa}
.timeboard-table .tb-day strong{display:block;font-size:13px;margin-bottom:6px;line-height:1.4}
.timeboard-table .tb-day small,.timeboard-table .tb-person small{display:block;color:#7d8d9e;font-size:10px;margin-top:5px;font-weight:500;line-height:1.4}
.timeboard-table .tb-day .tbl-add{margin-top:8px}
.timeboard-table .tb-person b{display:block;line-height:1.4;overflow-wrap:anywhere}
.timeboard-table .tb-today>.tb-day{background:#eaf3ff;color:#215aa0}
.timeboard-table .tb-lane-td{padding:0;border-right:0;vertical-align:middle}
.tb-lane{width:calc(var(--slot-count) * var(--slot));height:62px;display:grid;grid-template-columns:repeat(var(--slot-count),var(--slot));position:relative;isolation:isolate;background:#f6f8fb;overflow:hidden}
.tb-tick{border:0;border-right:1px solid #dce5ef;border-radius:0;padding:0;margin:0;min-height:62px;background:#f8fafc;cursor:default;position:relative;z-index:0}
.tb-tick.hour{border-left:1px solid #c2d5eb}
.tb-tick.free{background:#ebf8f0;color:#4d9973;cursor:pointer}.tb-tick.free:hover{background:#d7f1e1}
.tb-tick .plus{font-size:12px;font-weight:650;opacity:.65}
.tb-bar{position:absolute;box-sizing:border-box;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:7px;padding:0 9px;font-size:11px;font-weight:850;line-height:1.25;z-index:2;min-height:0;cursor:pointer}
.tb-bar.tb-shift{top:52px;height:8px;border-radius:4px;padding:0;background:#76b5a1;z-index:1;pointer-events:none}
.tb-bar.tb-book{top:8px;height:39px;background:#dce9ff;color:#1e559f;border:1px solid #afc9f5}
.tb-bar.tb-book.tentative{background:#fff0cd;color:#81550d;border-color:#edcf80}
.tb-bar.tb-book.done{background:#d7f5e7;color:#0d674d;border-color:#a9dcc5}
.tb-bar.tb-block{top:8px;height:39px;background:#ffe9c9;color:#885415;border:1px dashed #e6ae64}
.tb-bar.tb-block.unavailable{background:#e6e9f0;color:#5a6475;border-color:#b6c2d2}
.tb-bar .tb-bar-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-bar:hover{filter:brightness(.97)}.tb-bar:focus-visible{outline:3px solid #225fce;outline-offset:1px}
.timeboard-legend{display:flex;flex-wrap:wrap;gap:14px;padding:12px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--sub)}
.timeboard-note{color:var(--sub);font-size:11px;line-height:1.7;margin:9px 2px 20px}
.tb-details{margin-top:20px}.tb-details .section-head{margin-bottom:10px}
.tb-label{display:inline-block;border-radius:20px;padding:4px 9px;font-size:11px;font-weight:800;background:#ffefd5;color:#8c5a18}
.tb-label.unavailable{background:#e9edf4;color:#506078}
@media(max-width:720px){.timeboard-table{--slot:58px;--datew:81px;--staffw:100px}.timeboard-table .tb-day,.timeboard-table .tb-person{padding:7px 6px}.timeboard-table .tb-day strong{font-size:12px}.timeboard-table .tb-person b{font-size:11px}.timeboard-scroll{max-height:66vh}.timeboard-toolbar{padding:12px}.timeboard-filters{width:100%}.timeboard-filters select{flex:1;min-width:0}.tb-bar{padding:0 5px;font-size:10px}}

<body>
<div class="app">
  <aside class="sidebar"><div class="brand"><div class="brand-mark">F</div><div><strong>FitDesk</strong><small>GYM MANAGEMENT</small></div></div><nav class="nav" id="desktopNav"></nav><div class="side-foot">パーソナルジム向け<br>シフト・予約管理ツール<br><br>この端末内に保存されます</div></aside>
  <main class="main"><header class="topbar"><div><div class="eyebrow">OPERATIONS DASHBOARD</div><h1 id="pageTitle" class="page-title">シフト・予約カレンダー</h1><p class="desc" id="pageDesc">勤務と予約をひとつの画面で確認できます</p></div><div class="actions" id="topActions"></div></header><div id="demoBanner"></div><div id="content"></div></main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
(()=>{'use strict';
const $=(s,root=document)=>root.querySelector(s), $$=(s,root=document)=>Array.from(root.querySelectorAll(s));
const ICONS={calendar:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18"/>',booking:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/>',staff:'<circle cx="9" cy="8" r="3"/><path d="M2 20c0-4 3-7 7-7s7 3 7 7M17 8h5M19.5 5.5v5"/>',report:'<path d="M4 20V11M10 20V5M16 20v-8M22 20V8"/>',data:'<circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/>',plus:'<path d="M12 5v14M5 12h14"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/>',left:'<path d="m14 6-6 6 6 6"/>',right:'<path d="m10 6 6 6-6 6"/>',trash:'<path d="M4 7h16M10 3h4M6 7l1 14h10l1-14M10 11v6M14 11v6"/>',edit:'<path d="m14 5 5 5M4 20l4-.8L20 7a2.1 2.1 0 0 0-3-3L5 16z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'};
const icon=(name)=>`<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||ICONS.calendar}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const z=n=>String(n).padStart(2,'0'), dayKey=d=>`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
const fromKey=s=>{const a=String(s).split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addDays=(s,n)=>{let d=fromKey(s);d.setDate(d.getDate()+n);return dayKey(d)};
const monday=s=>{const d=fromKey(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return dayKey(d)};
const mins=t=>{const a=String(t||'0:0').split(':');return Number(a[0])*60+Number(a[1])};
const duration=(a,b)=>Math.max(0,mins(b)-mins(a));
const timeFromMinutes=m=>`${z(Math.floor(m/60))}:${z(m%60)}`;
const overlaps=(a,b,c,d)=>a<d&&c<b;
const niceDate=s=>{const d=fromKey(s);return `${d.getMonth()+1}月${d.getDate()}日(${['日','月','火','水','木','金','土'][d.getDay()]})`};
const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2);
const colors=['#377be7','#12a687','#995dd7','#ed8a38','#ce617f','#437d88','#6e80c7'];
const today=dayKey(new Date());
function sample(){const mon=monday(today), wed=addDays(mon,2), thu=addDays(mon,3), fri=addDays(mon,4), sat=addDays(mon,5);return {version:1,demo:true,staff:[{id:'s1',name:'スタッフA',role:'トレーナー',color:colors[0]},{id:'s2',name:'スタッフB',role:'トレーナー',color:colors[1]}],shifts:[{id:'sh1',staffId:'s1',date:mon,start:'09:00',end:'18:00',breakMin:60},{id:'sh2',staffId:'s1',date:wed,start:'10:00',end:'20:00',breakMin:60},{id:'sh3',staffId:'s1',date:fri,start:'09:00',end:'17:00',breakMin:45},{id:'sh4',staffId:'s2',date:mon,start:'12:00',end:'21:00',breakMin:60},{id:'sh5',staffId:'s2',date:thu,start:'10:00',end:'19:00',breakMin:60},{id:'sh6',staffId:'s2',date:sat,start:'09:00',end:'16:00',breakMin:45}],bookings:[{id:'b1',staffId:'s1',date:mon,start:'10:00',duration:60,client:'お客様A',menu:'パーソナル60分',status:'確定',notes:''},{id:'b2',staffId:'s2',date:mon,start:'14:30',duration:60,client:'お客様B',menu:'パーソナル60分',status:'仮予約',notes:''},{id:'b3',staffId:'s1',date:wed,start:'15:00',duration:90,client:'お客様C',menu:'パーソナル90分',status:'確定',notes:''},{id:'b4',staffId:'s2',date:thu,start:'11:00',duration:60,client:'お客様D',menu:'体験セッション',status:'完了',notes:''}]};}
const KEY='fitdesk_local_v1';
function load(){try{let raw=localStorage.getItem(KEY);if(raw){let obj=JSON.parse(raw);if(validData(obj))return obj}}catch(e){console.warn('load failed',e)}return sample()}
let tableStaff='all',tableTimeRange='all';
let db=load(),page='table',mode=window.innerWidth<=720?'day':'week',cursor=today,filterBooking='',filterStatus='',filterStaff='',filterFrom='',filterTo='',toastTimer=null;
db.blocks=Array.isArray(db.blocks)?db.blocks:[];
function validData(o){return o&&Array.isArray(o.staff)&&Array.isArray(o.shifts)&&Array.isArray(o.bookings)&&o.staff.every(s=>s&&typeof s.id==='string'&&typeof s.name==='string')&&o.shifts.every(s=>s&&typeof s.date==='string'&&typeof s.staffId==='string')&&o.bookings.every(b=>b&&typeof b.date==='string'&&typeof b.staffId==='string'&&typeof b.client==='string')}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('保存できませんでした。端末の空き容量やブラウザ設定を確認してください。')}render()}
const byStaff=id=>db.staff.find(x=>x.id===id);
const myShifts=(id,date)=>db.shifts.filter(s=>s.staffId===id&&s.date===date).sort((a,b)=>a.start.localeCompare(b.start));
const myBookings=(id,date)=>db.bookings.filter(b=>b.staffId===id&&b.date===date).sort((a,b)=>a.start.localeCompare(b.start));
const active=b=>b.status!=='キャンセル';
const worked=s=>Math.max(0,duration(s.start,s.end)-(Number(s.breakMin)||0));
const workingHours=list=>(list.reduce((n,s)=>n+worked(s),0)/60).toFixed(1);
const fmtM=m=>`${(m/60).toFixed(1)}h`;
const weekDays=()=>Array.from({length:7},(_,i)=>addDays(monday(cursor),i));
const periodShift=()=>db.shifts.filter(s=>weekDays().includes(s.date));
const periodBooking=()=>db.bookings.filter(b=>weekDays().includes(b.date));
const periodBlocks=()=>db.blocks.filter(x=>weekDays().includes(x.date));
const blocked=(staffId,date,start,end,ignore='')=>db.blocks.some(x=>x.id!==ignore&&x.staffId===staffId&&x.date===date&&overlaps(start,end,mins(x.start),mins(x.end)));
const statClass=s=>({'仮予約':'tentative','完了':'done','キャンセル':'cancel'}[s]||'');
function toast(msg){let root=$('#toastRoot');root.innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>root.innerHTML='',3000)}
const navs=[['table','シフト表','calendar'],['blocks','休憩・不可','clock'],['calendar','カレンダー','calendar'],['bookings','予約一覧','booking'],['staff','スタッフ','staff'],['reports','勤務・予約集計','report'],['settings','データ管理','data']];
function changePage(p){page=p;window.scrollTo({top:0,behavior:'smooth'});render()}
function render(){
 const titles={table:['シフト・予約表','縦軸は日付、横軸は15分刻み。予約時間を横長バーで表示します'],blocks:['休憩・予約不可時間','休憩や外出などの予約できない時間を管理します'],calendar:['シフト・予約カレンダー','勤務と予約をひとつの画面で確認できます'],bookings:['予約一覧','予約内容の確認・変更・キャンセル'],staff:['スタッフ管理','スタッフの追加・編集と担当状況'],reports:['勤務・予約集計','選択中の週の稼働状況をまとめます'],settings:['データ管理','バックアップや初期化を行います']};
 $('#pageTitle').textContent=titles[page][0];$('#pageDesc').textContent=titles[page][1];
 const navHtml=(mobile=false)=>navs.map(([id,label,ico])=>`<button type="button" data-nav="${id}" class="${mobile?'':'navbtn '}${page===id?'active':''}" ${page===id?'aria-current="page"':''}>${icon(ico)}<span>${mobile?(id==='reports'?'集計':id==='settings'?'設定':label):label}</span></button>`).join('');
 $('#desktopNav').innerHTML=navHtml();$('#mobileNav').innerHTML=navHtml(true);
 $('#topActions').innerHTML=page==='staff'?`<button class="btn primary" data-open="staff">${icon('plus')}スタッフを追加</button>`:page==='settings'?`<button class="btn" data-export="json">${icon('download')}バックアップを保存</button>`:page==='blocks'?`<button class="btn primary" data-open="block">${icon('plus')}休憩・不可を追加</button>`:`<button class="btn" data-open="shift">${icon('plus')}勤務</button><button class="btn" data-open="block">${icon('plus')}休憩・不可</button><button class="btn primary" data-open="booking">${icon('plus')}予約</button>`;
 $('#demoBanner').innerHTML=db.demo?`<div class="demo-banner"><span>現在は<strong>サンプルデータ</strong>を表示しています。お客様Aなどは架空の登録例です。</span><button data-clear-demo>サンプルを消して開始</button></div>`:'';
 $('#content').innerHTML=({table:renderTables,blocks:renderBlocks,calendar:renderCalendar,bookings:renderBookings,staff:renderStaff,reports:renderReports,settings:renderSettings}[page])();
}
function statCards(){const shifts=periodShift(),bookings=periodBooking().filter(active),bookMin=bookings.reduce((v,b)=>v+Number(b.duration),0),shiftMin=shifts.reduce((v,s)=>v+worked(s),0);const stats=[['勤務時間',fmtM(shiftMin),`${shifts.length}件のシフト`],['予約件数',bookings.length+'件','キャンセルを除く'],['予約時間',fmtM(bookMin),'予約枠の合計'],['予約占有率',shiftMin?Math.round(bookMin/shiftMin*100)+'%':'—','予約時間 ÷ 勤務時間']];return `<div class="stats">${stats.map((s,i)=>`<div class="panel stat"><div class="label">${s[0]}</div><div class="num">${s[1]}</div><div class="meta">${s[2]}</div><div class="line" style="background:${['#2e78e8','#0e9c81','#bd86dd','#efa947'][i]}"></div></div>`).join('')}</div>`}
function periodBar(){const days=weekDays();return `<div class="panel board-toolbar"><div class="toolbar-left"><button class="btn small" data-move="-7" aria-label="前の週">${icon('left')}</button><div class="weektitle">${niceDate(days[0])} 〜 ${niceDate(days[6])}</div><button class="btn small" data-move="7" aria-label="次の週">${icon('right')}</button><button class="btn small" data-today>今週</button></div><div class="toolbar-right"><div class="switch"><button data-mode="week" class="${mode==='week'?'selected':''}">週表示</button><button data-mode="day" class="${mode==='day'?'selected':''}">日表示</button></div>${mode==='day'?`<input aria-label="表示日" type="date" class="control" style="width:153px;min-height:37px" id="currentDay" value="${cursor}">`:''}</div></div>`}

function renderTables(){
 const days=weekDays(),staff=db.staff,shown=tableStaff==='all'?staff:staff.filter(s=>s.id===tableStaff);
 const weekShifts=periodShift(),weekBookings=periodBooking().filter(active),weekBlocks=periodBlocks();
 const keep=id=>shown.some(s=>s.id===id);
 const shifts=weekShifts.filter(s=>keep(s.staffId)),bookings=weekBookings.filter(b=>keep(b.staffId)),blocks=weekBlocks.filter(b=>keep(b.staffId));
 const starts=[540,...shifts.map(s=>mins(s.start)),...bookings.map(b=>mins(b.start)),...blocks.map(b=>mins(b.start))];
 const ends=[1260,...shifts.map(s=>mins(s.end)),...bookings.map(b=>mins(b.start)+Number(b.duration)),...blocks.map(b=>mins(b.end))];
 let first=Math.max(0,Math.floor(Math.min(...starts)/15)*15),last=Math.min(1440,Math.ceil(Math.max(...ends)/15)*15);
 if(tableTimeRange==='morning'){first=360;last=720}
 if(tableTimeRange==='afternoon'){first=720;last=1080}
 if(tableTimeRange==='evening'){first=1080;last=1440}
 const times=Array.from({length:(last-first)/15},(_,i)=>first+i*15);
 const slotPx=window.innerWidth<=720?58:64;
 const staffOpts='<option value="all">全スタッフ</option>'+staff.map(s=>`<option value="${esc(s.id)}" ${s.id===tableStaff?'selected':''}>${esc(s.name)}</option>`).join('');
 const ranges=[['all','全時間'],['morning','午前 6〜12時'],['afternoon','午後 12〜18時'],['evening','夜 18〜24時']].map(([value,label])=>`<option value="${value}" ${tableTimeRange===value?'selected':''}>${label}</option>`).join('');
 const bar=(start,end,title,markup,klass,attr)=>{
  const a=Math.max(mins(start),first),z=Math.min(mins(end),last);
  if(z<=a)return '';
  const left=((a-first)/15)*slotPx+2,w=((z-a)/15)*slotPx-4;
  return `<${attr?'button type="button"':'div'} class="tb-bar ${klass}" style="left:${left}px;width:${Math.max(w,16)}px" title="${esc(title)}" ${attr}><span class="tb-bar-text">${esc(markup)}</span></${attr?'button':'div'}>`;
 };
 const header=`<tr><th class="tb-day" scope="col">日付 ↓</th><th class="tb-person" scope="col">スタッフ</th>${times.map(t=>`<th class="tb-time ${t%60===0?'hour':''}" scope="col">${timeFromMinutes(t)}</th>`).join('')}</tr>`;
 const rows=days.map(date=>{
  const dayShifts=shifts.filter(s=>s.date===date),dayBookings=bookings.filter(b=>b.date===date);
  return shown.map((s,i)=>{
   const ss=dayShifts.filter(x=>x.staffId===s.id);
   const bb=dayBookings.filter(x=>x.staffId===s.id);
   const xx=blocks.filter(x=>x.date===date&&x.staffId===s.id);
   const dayHeader=i===0?`<th class="tb-day" scope="rowgroup" rowspan="${shown.length}"><strong>${esc(niceDate(date))}</strong><small>勤務 ${workingHours(dayShifts)}時間</small><small>予約 ${dayBookings.length}件</small><button class="tbl-add" type="button" data-open="shift" data-date="${date}">＋ 勤務</button></th>`:'';
   const person=`<th class="tb-person" scope="row"><b>${esc(s.name)}</b>${ss.map(sh=>`<small><button class="tbl-add" type="button" data-edit-shift="${esc(sh.id)}">${esc(sh.start)}〜${esc(sh.end)}</button></small>`).join('')||'<small>勤務なし</small>'}<small><button class="tbl-add" type="button" data-open="block" data-staff="${esc(s.id)}" data-date="${date}">＋ 休憩・不可</button></small></th>`;
   const ticks=times.map(t=>{
    const inside=ss.some(sh=>mins(sh.start)<=t&&t+15<=mins(sh.end));
    const taken=bb.some(b=>overlaps(t,t+15,mins(b.start),mins(b.start)+Number(b.duration)))||xx.some(b=>overlaps(t,t+15,mins(b.start),mins(b.end)));
    const free=inside&&!taken;
    return `<button type="button" class="tb-tick ${t%60===0?'hour':''} ${free?'free':''}" ${free?`data-add-booking="${esc(s.id)}" data-date="${date}" data-start="${timeFromMinutes(t)}" title="${esc(s.name)} ${timeFromMinutes(t)}から予約を追加" aria-label="${esc(s.name)} ${timeFromMinutes(t)}から予約を追加"`:'disabled aria-label="予約不可"'}>${free&&t%30===0?'<span class="plus">＋</span>':''}</button>`;
   }).join('');
   const shiftBars=ss.map(sh=>bar(sh.start,sh.end,`勤務 ${sh.start}〜${sh.end}`,'','tb-shift','')).join('');
   const bookedBars=bb.map(b=>bar(b.start,timeFromMinutes(mins(b.start)+Number(b.duration)),`${b.client}｜${b.start}〜${timeFromMinutes(mins(b.start)+Number(b.duration))}`,`${b.start} ${b.client} ${b.menu||''}`,`tb-book ${statClass(b.status)}`,`data-edit-booking="${esc(b.id)}"`)).join('');
   const blockBars=xx.map(b=>bar(b.start,b.end,`${b.type} ${b.start}〜${b.end} ${b.note||''}`,`${b.type} ${b.start}〜${b.end}`,`tb-block ${b.type==='予約不可'?'unavailable':''}`,`data-edit-block="${esc(b.id)}"`)).join('');
   return `<tr class="${date===today?'tb-today':''}">${dayHeader}${person}<td class="tb-lane-td" colspan="${times.length}"><div class="tb-lane" style="--slot-count:${times.length}">${ticks}${shiftBars}${bookedBars}${blockBars}</div></td></tr>`;
  }).join('');
 }).join('');
 const main=`<section class="table-section"><div class="panel timeboard-shell"><div class="timeboard-toolbar"><strong>週間シフト・予約時間割（15分刻み）</strong><div class="timeboard-filters"><select id="tableStaffFilter" class="control" aria-label="表示スタッフ">${staffOpts}</select><select id="tableTimeRange" class="control" aria-label="時間帯">${ranges}</select></div></div><div class="timeboard-scroll" tabindex="0" role="region" aria-label="縦軸が日付、横軸が15分間隔の時間割"><table class="timeboard-table"><thead>${header}</thead><tbody>${rows}</tbody></table></div><div class="timeboard-legend"><span>🟩 勤務・空き</span><span>🟦 確定予約</span><span>🟨 仮予約</span><span>🟧 休憩</span><span>⬜ 予約不可</span></div></div><p class="timeboard-note">予約は所要時間に合わせた横長のバーで表示します。バーをタップすると編集できます。緑色の「＋」から予約できます。既存の勤務休憩分は実働時間の集計に使い、追加する休憩枠は予約を防ぐためのものです（二重控除はしません）。</p></section>`;

 return statCards()+periodBar()+(staff.length?main+details:empty('スタッフを追加してください','スタッフ登録後に時間割が表示されます','staff'));

b>条件に合う予約がありません</b><p>検索条件を変えるか、新しい予約を追加してください。</p></div>'}</div>`}

function renderReports(){const shifts=periodShift(),bks=periodBooking().filter(active);let totals=db.staff.map(s=>{let a=shifts.filter(x=>x.staffId===s.id),bb=bks.filter(x=>x.staffId===s.id),m=a.reduce((v,x)=>v+worked(x),0),bm=bb.reduce((v,x)=>v+Number(x.duration),0);return {s,m,bm,n:bb.length}});const max=Math.max(...totals.map(x=>x.m),1);return `${periodBar()}${statCards()}<div class="detail-grid"><div class="panel content-panel"><h2 class="subheading">スタッフ別の勤務時間</h2><p class="hint">休憩時間を差し引いた実勤務時間</p><div class="summary-list">${totals.map(x=>`<div class="summary-row"><b>${esc(x.s.name)}</b><div class="bartrack"><div class="barfill" style="width:${x.m/max*100}%;background:${safeColor(x.s.color)}"></div></div><strong style="text-align:right">${fmtM(x.m)}</strong></div>`).join('')||'<p class="hint">スタッフが登録されていません</p>'}</div><button class="btn small" data-export="shifts">${icon('download')}シフトCSVを出力</button></div><div class="panel content-panel"><h2 class="subheading">予約内訳</h2><p class="hint">担当者ごとの予約数と予約時間</p><div class="table-scroll"><table class="data-table" style="min-width:340px"><thead><tr><th>スタッフ</th><th>予約数</th><th>予約時間</th><th>占有率</th></tr></thead><tbody>${totals.map(x=>`<tr><td>${esc(x.s.name)}</td><td>${x.n}</td><td>${fmtM(x.bm)}</td><td>${x.m?Math.round(x.bm/x.m*100)+'%':'—'}</td></tr>`).join('')}</tbody></table></div><p class="hint">※占有率 = 予約時間 / 実勤務時間。実際の稼働率とは異なる場合があります。</p></div></div>`}
function renderSettings(){return `<div class="detail-grid"><div class="panel content-panel"><div class="section-head"><h2 class="subheading">バックアップと出力</h2>${icon('download')}</div><p class="desc" style="margin-bottom:12px">このアプリの情報は現在のブラウザ内に保存されます。端末変更やブラウザデータ削除に備えて、定期的にバックアップしてください。</p><div class="data-actions"><button class="btn primary" data-export="json">${icon('download')}全データを保存（JSON）</button><button class="btn" data-import>バックアップを読み込む</button></div><hr style="border:0;border-top:1px solid var(--line);margin:23px 0"><h3>CSV出力</h3><div class="data-actions"><button class="btn" data-export="bookings">予約一覧CSV</button><button class="btn" data-export="shifts">勤務一覧CSV</button></div><input id="importFile" class="hidden" type="file" accept="application/json,.json"></div><div class="panel content-panel"><h2 class="subheading">データの状態</h2><div class="info-box" style="margin-top:14px"><p><strong>スタッフ：</strong> ${db.staff.length}名</p><p><strong>シフト：</strong> ${db.shifts.length}件</p><p><strong>予約：</strong> ${db.bookings.length}件</p><p><strong>休憩・不可：</strong> ${db.blocks.length}件</p><p><strong>保存先：</strong> このブラウザのローカルストレージ</p></div><p class="hint" style="margin:16px 0">ログイン・クラウド同期・複数人での共同編集は未対応です。個人情報を含む本番業務にはアクセス制御と安全な保存先が必要です。</p><button class="btn danger" data-reset>${icon('trash')}全データを初期化</button></div></div>`}
function safeColor(c){return /^#[0-9a-f]{6}$/i.test(c||'')?c:colors[0]}
function selectStaff(sel){return `<option value="">選択してください</option>${db.staff.map(s=>`<option value="${esc(s.id)}" ${s.id===sel?'selected':''}>${esc(s.name)}</option>`).join('')}`}
function field(label,name,control,full=false,help=''){return `<div class="field ${full?'full':''}"><label for="field_${name}">${label}</label>${control}${help?`<small>${help}</small>`:''}</div>`}

function modal(title,body,type,id){$('#modalRoot').innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><section role="dialog" aria-modal="true" aria-label="${esc(title)}" class="modal"><div class="modal-head"><h2>${esc(title)}</h2><button class="close" data-close aria-label="閉じる">×</button></div><form id="entryForm" data-type="${type}" data-id="${esc(id||'')}"><div class="formgrid">${body}</div><div class="modal-actions">${id?`<button class="btn danger small" type="button" data-delete="${type}" data-id="${esc(id)}">${icon('trash')}削除</button>`:'<span></span>'}<div class="right"><button class="btn" type="button" data-close>キャンセル</button><button class="btn primary" type="submit">${id?'変更を保存':'登録する'}</button></div></div></form></section></div>`;setTimeout(()=>$('.modal input:not([type="color"]),.modal select')?.focus(),10)}
function openStaff(id){let s=db.staff.find(x=>x.id===id)||{name:'',role:'トレーナー',color:colors[db.staff.length%colors.length]};modal(id?'スタッフを編集':'スタッフを追加',field('名前 *','name',input('name','text',s.name,'maxlength="30" required'))+field('役職・メモ','role',input('role','text',s.role,'maxlength="60"'))+field('表示カラー','color',input('color','color',safeColor(s.color))), 'staff',id)}
function openShift(id,pref={}){let s=db.shifts.find(x=>x.id===id)||{staffId:pref.staffId||db.staff[0]?.id||'',date:pref.date||cursor,start:'09:00',end:'18:00',breakMin:60};if(!db.staff.length){toast('先にスタッフを追加してください');changePage('staff');return}modal(id?'勤務を編集':'勤務を登録',field('担当スタッフ *','staffId',select('staffId',selectStaff(s.staffId)))+field('勤務日 *','date',input('date','date',s.date,'required'))+field('出勤 *','start',input('start','time',s.start,'required step="900"'))+field('退勤 *','end',input('end','time',s.end,'required step="900"'))+field('休憩（分）','breakMin',input('breakMin','number',s.breakMin,'min="0" max="1200" step="15"')),'shift',id)}
function openBooking(id,pref={}){let b=db.bookings.find(x=>x.id===id)||{staffId:pref.staffId||db.staff[0]?.id||'',date:pref.date||cursor,start:pref.start||'10:00',duration:60,client:'',menu:'パーソナル60分',status:'確定',notes:''};if(!db.staff.length){toast('先にスタッフを追加してください');changePage('staff');return}modal(id?'予約を編集':'新しい予約',field('お客様名 *','client',input('client','text',b.client,'maxlength="60" required'))+field('担当スタッフ *','staffId',select('staffId',selectStaff(b.staffId)))+field('予約日 *','date',input('date','date',b.date,'required'))+field('開始時刻 *','start',input('start','time',b.start,'required step="900"'))+field('所要時間 *','duration',select('duration',[30,45,60,75,90,120,150,180].map(n=>`<option value="${n}" ${Number(b.duration)===n?'selected':''}>${n}分</option>`).join('')))+field('予約状況','status',select('status',['確定','仮予約','完了','キャンセル'].map(s=>`<option ${s===b.status?'selected':''}>${s}</option>`).join('')))+field('メニュー','menu',input('menu','text',b.menu,'maxlength="80"'),true)+field('備考','notes',`<textarea class="control" id="field_notes" name="notes" maxlength="500">${esc(b.notes)}</textarea>`,true),'booking',id)}

function submitForm(form){const type=form.dataset.type,id=form.dataset.id,obj=Object.fromEntries(new FormData(form).entries());if(type==='staff'){obj.name=obj.name.trim();obj.role=obj.role.trim();if(!obj.name){alert('名前を入力してください');return}if(db.staff.some(s=>s.name===obj.name&&s.id!==id)){alert('同じ名前のスタッフが登録されています');return}if(id){Object.assign(db.staff.find(x=>x.id===id),obj)}else db.staff.push({id:uid(),...obj});db.demo=false}
 if(type==='shift'){if(!byStaff(obj.staffId)){alert('担当スタッフを選択してください');return}if(!/^\d{4}-\d{2}-\d{2}$/.test(obj.date)||mins(obj.end)<=mins(obj.start)){alert('勤務の開始・終了時刻を確認してください（当日中の勤務に対応）');return}obj.breakMin=Number(obj.breakMin)||0;if(obj.breakMin<0||obj.breakMin>=duration(obj.start,obj.end)){alert('休憩時間が勤務時間以上です');return}if(db.shifts.some(s=>s.id!==id&&s.staffId===obj.staffId&&s.date===obj.date&&overlaps(mins(s.start),mins(s.end),mins(obj.start),mins(obj.end)))){alert('同じスタッフの勤務時間が重複しています');return}let existingBookings=db.bookings.filter(b=>active(b)&&b.staffId===obj.staffId&&b.date===obj.date);if(id){let prev=db.shifts.find(s=>s.id===id);let replacing={...prev,...obj};for(let b of existingBookings){let futureShifts=db.shifts.filter(s=>s.id!==id&&s.staffId===obj.staffId&&s.date===obj.date).concat(replacing);if(!futureShifts.some(s=>mins(b.start)>=mins(s.start)&&mins(b.start)+Number(b.duration)<=mins(s.end))){if(!confirm('この変更により一部の予約が勤務時間外になります。変更しますか？'))return;break}}Object.assign(prev,obj)}else db.shifts.push({id:uid(),...obj});}
 if(type==='block'){if(!byStaff(obj.staffId)){alert('担当スタッフを選択してください');return}obj.note=(obj.note||'').trim();if(!['休憩','予約不可'].includes(obj.type)||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(obj.date)||!/^([01][0-9]|2[0-3]):(00|15|30|45)$/.test(obj.start)||!/^([01][0-9]|2[0-3]):(00|15|30|45)$/.test(obj.end)||mins(obj.end)<=mins(obj.start)){alert('日付・15分刻みの開始終了時刻を確認してください');return}if(blocked(obj.staffId,obj.date,mins(obj.start),mins(obj.end),id)){alert('同じスタッフの休憩・予約不可時間と重なっています');return}if(db.bookings.some(b=>active(b)&&b.staffId===obj.staffId&&b.date===obj.date&&overlaps(mins(obj.start),mins(obj.end),mins(b.start),mins(b.start)+Number(b.duration)))){alert('既存の予約と重なっています。先に予約時間を調整してください');return}if(id)Object.assign(db.blocks.find(x=>x.id===id),obj);else db.blocks.push({id:uid(),...obj});db.demo=false}
 if(type==='booking'){obj.client=obj.client.trim();obj.menu=obj.menu.trim();obj.notes=obj.notes.trim();obj.duration=Number(obj.duration);if(!obj.client||!byStaff(obj.staffId)){alert('お客様名と担当スタッフを入力してください');return}let t=mins(obj.start);if(!/^\d{4}-\d{2}-\d{2}$/.test(obj.date)||t+obj.duration>1440){alert('予約の日時を確認してください（当日中の予約に対応）');return}if(obj.status!=='キャンセル'&&db.bookings.some(b=>b.id!==id&&active(b)&&b.staffId===obj.staffId&&b.date===obj.date&&overlaps(t,t+obj.duration,mins(b.start),mins(b.start)+Number(b.duration)))){alert('このスタッフの別の予約と時間が重複しています。日時を変更してください。');return}if(obj.status!=='キャンセル'&&blocked(obj.staffId,obj.date,t,t+obj.duration)){alert('休憩・予約不可時間と重なるため予約できません');return}let hasShift=db.shifts.some(s=>s.staffId===obj.staffId&&s.date===obj.date&&t>=mins(s.start)&&t+obj.duration<=mins(s.end));if(obj.status!=='キャンセル'&&!hasShift&&!confirm('予約が登録済みの勤務時間内に収まっていません。勤務をあとから登録する場合など、続行しますか？'))return;if(id)Object.assign(db.bookings.find(x=>x.id===id),obj);else db.bookings.push({id:uid(),...obj});}
 closeModal();save();toast(id?'変更を保存しました':'登録しました');}
function deleteEntry(type,id){let arr=type==='staff'?db.staff:type==='shift'?db.shifts:type==='block'?db.blocks:db.bookings,entry=arr.find(x=>x.id===id);if(!entry)return;if(type==='staff'&&(db.shifts.some(s=>s.staffId===id)||db.bookings.some(b=>b.staffId===id)||db.blocks.some(b=>b.staffId===id))){alert('勤務・予約・休憩が登録されているスタッフは削除できません。先に該当データを移動または削除してください。');return}if(!confirm(`この${type==='staff'?'スタッフ':type==='shift'?'勤務':type==='block'?'休憩・不可時間':'予約'}を削除しますか？\nこの操作は元に戻せません。`))return;arr.splice(arr.indexOf(entry),1);db.demo=false;closeModal();save();toast('削除しました')}
function download(filename,blob){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function csvLine(arr){return arr.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')}
function exportData(type){if(type==='json'){download('fitdesk_backup_'+today+'.json',new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));toast('バックアップを保存しました');return}let rows;if(type==='bookings')rows=[['予約日','開始','終了','所要時間(分)','担当者','お客様名','メニュー','状況','備考'],...db.bookings.map(b=>[b.date,b.start,timeFromMinutes(mins(b.start)+Number(b.duration)),b.duration,byStaff(b.staffId)?.name||'',b.client,b.menu,b.status,b.notes])];else rows=[['勤務日','出勤','退勤','休憩(分)','実勤務(時間)','スタッフ名'],...db.shifts.map(s=>[s.date,s.start,s.end,s.breakMin,(worked(s)/60).toFixed(2),byStaff(s.staffId)?.name||''])];download('fitdesk_'+type+'_'+today+'.csv',new Blob(['\ufeff'+rows.map(csvLine).join('\r\n')],{type:'text/csv;charset=utf-8'}));toast('CSVを出力しました')}
async function importData(file){if(!file)return;try{let parsed=JSON.parse(await file.text());if(!validData(parsed))throw Error('データ構造が異なります');if(!confirm(`バックアップを復元しますか？\n現在のデータは上書きされます。\nスタッフ ${parsed.staff.length}名、勤務 ${parsed.shifts.length}件、予約 ${parsed.bookings.length}件`))return;db={version:1,demo:false,staff:parsed.staff,shifts:parsed.shifts,bookings:parsed.bookings,blocks:Array.isArray(parsed.blocks)?parsed.blocks:[]};save();toast('バックアップを復元しました')}catch(e){alert('ファイルを読み込めませんでした。FitDeskのJSONバックアップを選択してください。')}finally{$('#importFile').value=''}}
document.addEventListener('click',e=>{const el=e.target.closest('button,[data-nav],[data-import],[data-export]');if(!el){if(e.target.id==='modalBackdrop')closeModal();return}let d=el.dataset;if(d.nav){changePage(d.nav);return}if(d.open){({staff:openStaff,shift:openShift,booking:openBooking,block:openBlock}[d.open])(undefined,{staffId:d.staff,date:d.date,start:d.start});return}if(d.addBooking){openBooking(undefined,{staffId:d.addBooking,date:d.date,start:d.start});return}if(d.editBlock){openBlock(d.editBlock);return}if(d.editBooking){openBooking(d.editBooking);return}if(d.editShift){openShift(d.editShift);return}if(d.editStaff){openStaff(d.editStaff);return}if(d.close!==undefined){closeModal();return}if(d.delete){deleteEntry(d.delete,d.id);return}if(d.pickDay){cursor=d.pickDay;render();return}if(d.mode){mode=d.mode;render();return}if(d.move){cursor=addDays(cursor,Number(d.move));render();return}if(d.today!==undefined){cursor=today;render();return}if(d.export){exportData(d.export);return}if(d.import!==undefined){$('#importFile')?.click();return}if(d.clearDemo!==undefined){if(confirm('サンプルデータをすべて削除しますか？')){db={version:1,demo:false,staff:[],shifts:[],bookings:[],blocks:[]};save();toast('空の状態から開始できます')}return}if(d.reset!==undefined){if(confirm('すべてのデータを削除して初期化しますか？\nこの操作は元に戻せません。先にバックアップしてください。')&&confirm('最終確認：スタッフ・勤務・予約をすべて削除しますか？')){db={version:1,demo:false,staff:[],shifts:[],bookings:[],blocks:[]};save();toast('初期化しました')}return}});
document.addEventListener('submit',e=>{if(e.target.id==='entryForm'){e.preventDefault();submitForm(e.target)}});
document.addEventListener('change',e=>{const id=e.target.id;if(id==='tableStaffFilter'){tableStaff=e.target.value;render()}else if(id==='tableTimeRange'){tableTimeRange=e.target.value;render()}else if(id==='currentDay'||id==='tableDay'){cursor=e.target.value;render()}else if(id==='statusFilter'){filterStatus=e.target.value;render()}else if(id==='staffFilter'){filterStaff=e.target.value;render()}else if(id==='fromFilter'){filterFrom=e.target.value;render()}else if(id==='toFilter'){filterTo=e.target.value;render()}else if(id==='importFile')importData(e.target.files?.[0]);});
document.addEventListener('input',e=>{if(e.target.id==='bookingSearch'){filterBooking=e.target.value;const pos=e.target.selectionStart;render();const field=$('#bookingSearch');field?.focus();field?.setSelectionRange(pos,pos)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
})();
</script>
</body></html>
