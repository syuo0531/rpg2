<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17695f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="JSPO-AT試験対策：ビタミン13種類の働き・欠乏症・過剰摂取を覚えるシンプルな単語帳">
<title>ビタミン単語帳 | JSPO-AT試験対策</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2317695f'/%3E%3Cpath d='M20 25c16-6 23 0 30 4 8-4 16-10 30-4v52c-16-6-23-1-30 3-8-4-16-9-30-3zM50 29v51' stroke='white' stroke-width='7' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./cards.css?v=2">
</head>
<body>
<header><div class="container"><div class="brand"><span class="logo" aria-hidden="true">▤</span><div><h1>ビタミン単語帳</h1><p>JSPO-AT試験対策 ／ 栄養学</p></div></div><span class="count">13種類を収録</span></div></header>
<main class="container">
<section class="intro"><h2>1枚ずつ、確実に覚える。</h2><p>ビタミンの働き・欠乏症・過剰摂取時の症状を、カードをめくって暗記。</p></section>
<section class="progress" aria-label="学習状況"><div class="progress-main"><div class="progress-copy"><span>覚えたカード</span><b><span id="known-count">0</span> / 13</b></div><div class="track"><span id="bar"></span></div></div><div class="review-n">もう一度<b id="retry-count">0</b></div></section>
<nav class="tabs" role="tablist" aria-label="表示するページ"><button class="tab active" id="tab-cards" type="button" role="tab" aria-selected="true" data-action="view" data-view="cards">単語帳</button><button class="tab" id="tab-list" type="button" role="tab" aria-selected="false" data-action="view" data-view="list">一覧で確認</button></nav>
<div class="layout">
<section class="study panel" id="study">
<div class="options"><div><label for="group">表示するカード</label><select id="group"><option value="all">すべて（13種類）</option><option value="water">水溶性（9種類）</option><option value="fat">脂溶性（4種類）</option><option value="unlearned">まだ覚えていない</option><option value="again">もう一度だけ</option></select></div><div><label for="mode">カードの表面</label><select id="mode"><option value="name">ビタミン名 → 特徴</option><option value="role">働き → ビタミン名</option><option value="deficiency">欠乏症 → ビタミン名</option></select></div></div>
<div class="row-line"><span>カード <b id="position">1 / 13</b></span><button id="shuffle" type="button" class="linkbutton" data-action="shuffle">シャッフル</button></div>
<div id="study-body"><button type="button" id="flash" class="flash" data-action="flip" aria-label="答えを見る"></button><div class="buttons"><button class="btn dim" type="button" data-action="prev">← 前へ</button><button class="btn green" type="button" data-action="flip" id="flip-label">答えを見る</button><button class="btn dim" type="button" data-action="next">次へ →</button></div><div id="record" hidden><div class="record-label">覚えられた？</div><div class="buttons" style="margin-top:0"><button class="btn cream" type="button" data-action="again">↺ もう一度</button><button class="btn green" type="button" data-action="known">✓ 覚えた</button></div></div></div>
<div class="empty" id="empty" hidden><h3>表示するカードがありません</h3><p id="empty-message"></p><button type="button" class="btn green" data-action="all">すべてのカードを見る</button></div>
<p id="notice" class="note" role="status" aria-live="polite"></p>
</section>
<section id="listing" class="list panel" hidden><h3>ビタミン一覧</h3><p>項目をタップすると単語帳のカードを開けます。</p><div class="list-grid" id="list-grid"></div></section>
<aside class="sidebar panel"><h3>カード一覧</h3><div id="mini" class="mini"></div></aside>
</div>
<p class="note">※ 添付されたビタミン一覧表をもとにした学習用データです。「元の一覧表に記載なし」は、症状が存在しないという意味ではありません。欠乏症からの逆引きは、欠乏症の記載がある項目のみ表示します。</p>
<footer class="footer"><p>学習状況は同じブラウザ内に自動保存されます。</p><button type="button" class="reset" data-action="reset">学習記録をリセット</button></footer>
</main>
<script src="./data/vitamins.js?v=2"></script>
<script src="./cards.js?v=2"></script>
</body></html>
