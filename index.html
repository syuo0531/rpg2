  <script>(() => {
  'use strict';
  const vitamins = window.VITAMIN_DATA || [];
  const SAVE_KEY = 'vitamin-forge-save-v1';
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
  const escapeHTML = s => String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const random = arr => arr[Math.floor(Math.random() * arr.length)];
  const shuffle = arr => {
    const copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  };
  const today = () => new Intl.DateTimeFormat('sv-SE', {timeZone: 'Asia/Tokyo', year:'numeric', month:'2-digit', day:'2-digit'}).format(new Date());
  const defaults = () => ({ xp:0, total:0, correct:0, bestCombo:0, combo:0, daily:{date:today(), total:0, correct:0}, weak:{}, answered:{}, cardKnown:{}, recent:[] });
  function load() {
    try {
      const raw = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
      if (!raw || typeof raw !== 'object') return defaults();
      const s = {...defaults(), ...raw};
      for (const key of ['weak','answered','cardKnown']) if (!s[key] || typeof s[key] !== 'object' || Array.isArray(s[key])) s[key] = {};
      if (!s.daily || typeof s.daily !== 'object' || s.daily.date !== today()) s.daily = {date:today(), total:0, correct:0};
      if (!Array.isArray(s.recent)) s.recent = [];
      for (const key of ['xp','total','correct','bestCombo','combo']) s[key] = Math.max(0, Number(s[key]) || 0);
      return s;
    } catch(e) { return defaults(); }
  }
  let progress = load();
  const ui = {
    page:'home', scope:'all', quizType:'all', quiz:null,
    cardScope:'all', cardMode:'mix', cards:[], cardIndex:0, cardFlipped:false,
    selectedVitamin:null, search:'', toastTimer:null
  };
  function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(progress)); } catch(e) { toast('保存に失敗しました。ブラウザの空き容量をご確認ください。'); } }
  function calcLevel(xp = progress.xp) { return Math.floor(Math.sqrt(Math.max(xp, 0) / 140)) + 1; }
  function levelInfo() {
    const lv = calcLevel(); const start = (lv - 1) ** 2 * 140; const end = lv ** 2 * 140;
    return {lv, pct:Math.max(0, Math.min(100, (progress.xp - start) / (end - start) * 100)), toNext:end - progress.xp};
  }
  function daily() { if (progress.daily.date !== today()) { progress.daily = {date:today(), total:0, correct:0}; save(); } return progress.daily; }
  function toast(message) {
    const el = $('#toast'); if (!el) return;
    el.textContent = message; el.classList.add('show');
    clearTimeout(ui.toastTimer); ui.toastTimer = setTimeout(() => el.classList.remove('show'), 2700);
  }
  function vById(id) { return vitamins.find(v => v.id === id); }
  function categoryText(group) { return group === 'water' ? '水溶性' : '脂溶性'; }
  function categoryIcon(group) { return group === 'water' ? '◈' : '♨'; }
  function safeGroup(group) { return group === 'water' ? 'water' : 'fat'; }
  function label(v) { return v.name; }
  function emptyNotice(text) { return `<div class="empty-note">${escapeHTML(text)}</div>`; }
  function smallTag(v) { return `<span class="pill ${safeGroup(v.group)}">${categoryIcon(v.group)} ${categoryText(v.group)}</span>`; }
  function fmt(s) { return s === null || s === undefined ? '<span class="no-data">画像では記載なし</span>' : escapeHTML(s); }
  function scopeSelect(current, action) {
    return `<div class="segment" role="group" aria-label="出題範囲">
      ${[['all','すべて 13種'], ['water','水溶性 9種'], ['fat','脂溶性 4種']].map(([val,name]) => `<button class="seg-btn ${current === val ? 'selected' : ''}" data-action="${action}" data-value="${val}" aria-pressed="${current === val}">${name}</button>`).join('')}
    </div>`;
  }
  function headerTitle(title) { $('#page-title').textContent = title; }
  function updateStats() {
    const lv = calcLevel(); $('#top-level').textContent = `LV.${lv}`; $('#top-xp').textContent = `${progress.xp} XP`;
    $$('[data-nav]').forEach(el => {
      const active = el.dataset.nav === ui.page;
      el.classList.toggle('active', active);
      if (el.tagName === 'BUTTON') el.setAttribute('aria-current', active ? 'page' : 'false');
    });
  }
  const titles = {home:'DASHBOARD',quiz:'QUIZ ARENA',cards:'MEMORY CARDS',library:'VITAMIN CODEX',review:'REVIEW ROOM',reference:'REFERENCE'};
  function navigate(page) {
    if (!(page in titles)) return;
    ui.page = page;
    if (page === 'quiz') ui.quiz = null;
    if (page === 'cards') buildCards();
    render(); window.scrollTo({top:0,behavior:'instant'});
  }
  function render() {
    daily(); headerTitle(titles[ui.page]); updateStats();
    const main = $('#main-content');
    if (!main) return;
    if (ui.page === 'home') main.innerHTML = renderHome();
    if (ui.page === 'quiz') main.innerHTML = renderQuiz();
    if (ui.page === 'cards') main.innerHTML = renderCards();
    if (ui.page === 'library') main.innerHTML = renderLibrary();

    if (ui.page === 'reference') main.innerHTML = renderReference();
  }
  function renderHome() {

      </section>
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-icon amber">✦</div><span class="stat-name">YOUR LEVEL</span><strong class="stat-value">${level.lv}<small> LV</small></strong><div class="thin-track"><span style="width:${level.pct}%"></span></div><small class="stat-foot">次のレベルまで ${level.toNext} XP</small></div>
        <div class="stat-card"><div class="stat-icon mint">◎</div><span class="stat-name">ACCURACY</span><strong class="stat-value">${rate}<small> %</small></strong><div class="stat-foot">正解 ${progress.correct} / 解答 ${progress.total} 問</div></div>
        <div class="stat-card"><div class="stat-icon purple">⚡</div><span class="stat-name">BEST COMBO</span><strong class="stat-value">${progress.bestCombo}<small> 連続</small></strong><div class="stat-foot">最高連続正解数</div></div>
        <div class="stat-card"><div class="stat-icon coral">✚</div><span class="stat-name">NEED REVIEW</span><strong class="stat-value">${weakNum}<small> 種</small></strong><button class="stat-foot as-button" data-nav="review">苦手を見直す ↗</button></div>
      </div>
      <div class="home-columns">
        <section class="panel">
          <div class="panel-title-row"><div><span class="kicker">SELECT YOUR MODE</span><h2>トレーニング</h2></div><span class="dim-label">01 / 03</span></div>
          <div class="mode-list">
            <button class="mode-row" data-nav="quiz"><span class="mode-icon quiz-icon">⚔</span><span class="mode-info"><b>4択クイズ</b><small>働き・欠乏症・過剰症をランダム出題</small></span><span class="mode-arrow">↗</span></button>
            <button class="mode-row" data-nav="cards"><span class="mode-icon card-icon">▤</span><span class="mode-info"><b>暗記カード</b><small>めくって覚える。覚えた度合いを記録</small></span><span class="mode-arrow">↗</span></button>
            <button class="mode-row" data-nav="library"><span class="mode-icon book-icon">◫</span><span class="mode-info"><b>ビタミン図鑑</b><small>13種類すべてを一覧・検索</small></span><span class="mode-arrow">↗</span></button>

  }
  function buildQuestions(scope, type = 'all') {
    const inScope = vitamins.filter(v => scope === 'all' || v.group === scope);
    const allDef = vitamins.filter(v => v.deficiency && v.deficiencyShort);
    const allExc = vitamins.filter(v => v.excess && v.excessShort);
    const bank = [];
    function multiple({id, vitamin, kind, prompt, correct, optionsFrom, explain, hint}) {
      const candidates = shuffle([...new Set(optionsFrom.filter(x => x && x !== correct))]);
      if (candidates.length < 3) return;
      const choices = shuffle([correct,...candidates.slice(0,3)]);
      bank.push({id, vitaminId:vitamin.id, kind, prompt, choices, correct, explain, hint});
    }
    inScope.forEach(v => {
      const names = (scope === 'all' ? vitamins : inScope).map(x => x.name);
      if (type === 'all' || type === 'role') {
        multiple({id:`${v.id}-role`,vitamin:v,kind:'働き',prompt:`${v.name}の主な働きは？`,correct:v.roleShort,optionsFrom:vitamins.map(x => x.roleShort),explain:`${v.name}（${v.alias}）：${v.role}`,hint:v.mnemonic});
        multiple({id:`${v.id}-reverse-role`,vitamin:v,kind:'働き',prompt:`「${v.roleHint}」に関わるビタミンは？`,correct:v.name,optionsFrom:names,explain:`${v.name}（${v.alias}）：${v.role}`,hint:v.mnemonic});
      }
      if ((type === 'all' || type === 'deficiency') && v.deficiency) {
        const options = allDef.filter(other => {
          // 類似した貧血や「通常は欠乏がまれ」を誤答として並べない
          if (['b9','b12'].includes(v.id) && ['b9','b12'].includes(other.id) && other.id !== v.id) return false;
          if (['b5','b7'].includes(v.id) && ['b5','b7'].includes(other.id) && other.id !== v.id) return false;
          return true;
        }).map(x => x.deficiencyShort);
        multiple({id:`${v.id}-deficiency`,vitamin:v,kind:'欠乏症',prompt:`${v.name}の欠乏について正しいものは？`,correct:v.deficiencyShort,optionsFrom:options,explain:`${v.name}の欠乏：${v.deficiency}`,hint:v.mnemonic});
        if (v.deficiencyHint) {
          multiple({id:`${v.id}-reverse-deficiency`,vitamin:v,kind:'欠乏症',prompt:`「${v.deficiencyHint}」と特に関係するビタミンは？`,correct:v.name,optionsFrom:names.filter(n => !(v.id === 'b12' && n === '葉酸')),explain:`${v.name}の欠乏：${v.deficiency}`,hint:v.mnemonic});
        }

  if (!vitamins.length) { $('#main-content').textContent='問題データが読み込めませんでした。data/vitamins.js を確認してください。'; return; }
  buildCards(); render();
})();
